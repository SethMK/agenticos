<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S022 — variant 1 · language-bar</title>
<style>
  :root {
    --bg:           #0A0A0A;
    --bg-panel:     #111111;
    --bg-elevated:  #161616;
    --fg:           #E6E6E6;
    --fg-dim:       #9A9A9A;
    --muted:        #6B6B6B;
    --border:       #2A2A2A;
    --border-strong:#3A3A3A;
    --accent:       #FF6A00;
    --accent-dim:   #B24A00;
    --font-mono:    "Fira Code", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --motion-fast: 120ms;
    --easing: cubic-bezier(0.2, 0.8, 0.2, 1);
    font-variant-numeric: tabular-nums lining-nums;
  }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.45;
    margin: 0;
    padding: var(--space-5);
  }
  .variant-header {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: var(--space-5);
    border-bottom: 1px dotted var(--border);
    padding-bottom: var(--space-3);
  }
  .variant-header em {
    color: var(--accent);
    font-style: normal;
  }
  .stage {
    max-width: 480px;
  }

  /* ---- the component itself ---- */
  .split {
    position: relative;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: var(--space-5);
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .title {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .title .glyph { color: var(--accent); font-size: 0.65em; }
  .totals {
    font-size: 12px;
    color: var(--fg-dim);
  }
  .totals strong { color: var(--fg); font-weight: 600; }

  /* horizontal bar — like GitHub language strip */
  .bar {
    display: flex;
    width: 100%;
    height: 14px;
    border: 1px solid var(--border-strong);
    background: var(--bg);
    overflow: hidden;
    margin-bottom: var(--space-4);
  }
  .seg {
    display: block;
    height: 100%;
    transition: filter var(--motion-fast) var(--easing);
  }
  .seg + .seg { border-left: 1px solid var(--bg-panel); }
  .seg:hover { filter: brightness(1.15); }
  .seg.work     { background: var(--accent); }
  .seg.personal { background: var(--accent-dim); }

  /* legend table */
  .legend {
    list-style: none;
    padding: 0;
    margin: 0;
    display: grid;
    gap: var(--space-1);
    font-size: 12px;
  }
  .row {
    display: grid;
    grid-template-columns: 12px 1fr auto auto;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-1) 0;
    border-bottom: 1px dotted var(--border);
  }
  .row:last-child { border-bottom: 0; }
  .swatch {
    width: 10px; height: 10px;
    border: 1px solid var(--border-strong);
  }
  .row .name { color: var(--fg); text-transform: uppercase; letter-spacing: 0.08em; }
  .row .pct  { color: var(--accent); font-weight: 600; min-width: 5ch; text-align: right; }
  .row .cnt  { color: var(--fg-dim); min-width: 4ch; text-align: right; }
  .swatch.work     { background: var(--accent); }
  .swatch.personal { background: var(--accent-dim); }

  .total-line {
    margin-top: var(--space-3);
    padding-top: var(--space-3);
    border-top: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    display: flex;
    justify-content: space-between;
  }
  .total-line .num { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<header class="variant-header">VARIANT 1 · <em>LANGUAGE BAR</em> — GitHub-style segmented strip, 26 / 7</header>

<div class="stage">
  <section class="split" aria-label="Project split: work vs personal">
    <div class="head">
      <h2 class="title"><span class="glyph" aria-hidden="true">◆</span> PROJECTS</h2>
      <div class="totals"><strong>33</strong> total</div>
    </div>

    <div class="bar" role="img" aria-label="Project split: 78.8% work, 21.2% personal">
      <span class="seg work"     style="width: 78.78787878787878%;" title="work — 78.8% · 26 projects"></span>
      <span class="seg personal" style="width: 21.21212121212121%;" title="personal — 21.2% · 7 projects"></span>
    </div>

    <ul class="legend">
      <li class="row">
        <span class="swatch work" aria-hidden="true"></span>
        <span class="name">work</span>
        <span class="pct">78.8%</span>
        <span class="cnt">26</span>
      </li>
      <li class="row">
        <span class="swatch personal" aria-hidden="true"></span>
        <span class="name">personal</span>
        <span class="pct">21.2%</span>
        <span class="cnt">7</span>
      </li>
    </ul>

    <div class="total-line">
      <span>total</span><span class="num">33</span>
    </div>
  </section>
</div>
</body>
</html>
