<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>S022 — variant 4 · bracket annotation</title>
<style>
  :root {
    --bg:           #0A0A0A;
    --bg-panel:     #111111;
    --bg-elevated:  #161616;
    --fg:           #E6E6E6;
    --fg-dim:       #9A9A9A;
    --muted:        #6B6B6B;
    --border:       #2A2A2A;
    --border-strong:#3A3A3A;
    --accent:       #FF6A00;
    --accent-dim:   #B24A00;
    --font-mono:    "Fira Code", "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    --font-display: "Berkeley Mono", "JetBrains Mono", ui-monospace, monospace;
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --motion-fast: 120ms;
    --easing: cubic-bezier(0.2, 0.8, 0.2, 1);
    font-variant-numeric: tabular-nums lining-nums;
  }
  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.45;
    margin: 0;
    padding: var(--space-5);
  }
  .variant-header {
    color: var(--muted);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: var(--space-5);
    border-bottom: 1px dotted var(--border);
    padding-bottom: var(--space-3);
  }
  .variant-header em { color: var(--accent); font-style: normal; }
  .stage { max-width: 520px; }

  /* ---- component ---- */
  .split {
    position: relative;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: var(--space-5);
  }
  .head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .title {
    margin: 0;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 600;
    display: flex; align-items: center; gap: var(--space-2);
  }
  .title .glyph { color: var(--accent); font-size: 0.65em; }
  .totals { font-size: 12px; color: var(--fg-dim); }
  .totals strong { color: var(--fg); font-weight: 600; }

  /* The big number row sits ABOVE the bar — like a CLI summary line. */
  .counts {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: var(--space-3);
    gap: var(--space-3);
  }
  .count {
    display: flex; flex-direction: column;
    gap: 2px;
  }
  .count.personal { text-align: right; align-items: flex-end; }
  .count .num {
    font-family: var(--font-display);
    font-size: 36px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .count.work     .num { color: var(--accent); }
  .count.personal .num { color: var(--accent-dim); }
  .count .lbl {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  .count .lbl::before {
    content: '◆ ';
    color: var(--accent);
    font-size: 0.85em;
  }
  .count.personal .lbl::before { color: var(--accent-dim); }

  /* the bar SVG: stacked horizontal, with tick + label annotations */
  .bar-wrap { position: relative; }
  .bar-svg {
    display: block;
    width: 100%;
    height: 56px;
    overflow: visible;
  }
  .bar-svg .track {
    fill: var(--bg);
    stroke: var(--border-strong);
    stroke-width: 1;
  }
  .bar-svg .seg-work     { fill: var(--accent); }
  .bar-svg .seg-personal { fill: var(--accent-dim); }
  .bar-svg .seg-divider {
    stroke: var(--bg-panel);
    stroke-width: 1;
  }
  .bar-svg .tick {
    stroke: var(--accent);
    stroke-width: 1;
  }
  .bar-svg .tick-personal { stroke: var(--accent-dim); }
  .bar-svg .lbl {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    fill: var(--fg-dim);
  }
  .bar-svg .lbl-pct {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .bar-svg .lbl-pct.work     { fill: var(--accent); }
  .bar-svg .lbl-pct.personal { fill: var(--accent-dim); }

  /* horizontal-rule footer */
  .footer {
    margin-top: var(--space-4);
    padding-top: var(--space-3);
    border-top: 1px dotted var(--border);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .footer .ratio {
    color: var(--fg);
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
  }
  .footer .ratio .sep { color: var(--border-strong); margin: 0 4px; }
  .footer .ratio .w   { color: var(--accent); font-weight: 600; }
  .footer .ratio .p   { color: var(--accent-dim); font-weight: 600; }
  .footer .total .num { color: var(--accent); font-weight: 600; }

  /* mobile reflow — keep readable at 360px */
  @media (max-width: 420px) {
    .count .num { font-size: 30px; }
  }
</style>
</head>
<body>
<header class="variant-header">VARIANT 4 · <em>BRACKET ANNOTATION</em> — terminal-style annotated split bar</header>

<div class="stage">
  <section class="split" aria-label="Project split: work vs personal">
    <div class="head">
      <h2 class="title"><span class="glyph" aria-hidden="true">◆</span> PROJECTS · SPLIT</h2>
      <div class="totals"><strong>33</strong> total</div>
    </div>

    <div class="counts">
      <div class="count work">
        <span class="num">26</span>
        <span class="lbl">work</span>
      </div>
      <div class="count personal">
        <span class="num">7</span>
        <span class="lbl">personal</span>
      </div>
    </div>

    <div class="bar-wrap">
      <!--
        SVG geometry: viewBox 0 0 400 56.
        Bar sits at y=14..30 (height 16). Tick marks drop from the segment
        boundaries down to y=40 then a label sits at y=52.
        Work segment width % = 78.79, personal = 21.21.
        At width 400: work = 315.15, personal = 84.85.
        Boundary X = 315.15. Ticks at 0, 315.15, 400.
      -->
      <svg class="bar-svg" viewBox="0 0 400 56" preserveAspectRatio="none" role="img"
           aria-label="Stacked split bar: 26 work projects (78.8%), 7 personal projects (21.2%), total 33">
        <!-- track outline -->
        <rect class="track" x="0.5" y="14" width="399" height="16" />
        <!-- segments -->
        <rect class="seg-work"     x="1"      y="15" width="314.15" height="14" />
        <rect class="seg-personal" x="315.15" y="15" width="83.85"  height="14" />
        <!-- divider between segments -->
        <line class="seg-divider" x1="315.15" y1="15" x2="315.15" y2="29" />

        <!-- tick + label: 0 -->
        <line class="tick" x1="1" y1="30" x2="1" y2="40" />
        <text class="lbl"  x="3" y="51" text-anchor="start">0</text>

        <!-- tick + label: boundary (26) -->
        <line class="tick" x1="315.15" y1="30" x2="315.15" y2="40" />
        <text class="lbl-pct work" x="313" y="51" text-anchor="end">26 · 78.8%</text>

        <!-- tick + label: total (33) -->
        <line class="tick tick-personal" x1="399" y1="30" x2="399" y2="40" />
        <text class="lbl-pct personal" x="397" y="51" text-anchor="end">+7 · 21.2%</text>
      </svg>
    </div>

    <div class="footer">
      <div class="ratio">
        <span class="w">26</span><span class="sep">:</span><span class="p">7</span>
        <span style="margin-left: var(--space-2);">ratio</span>
      </div>
      <div class="total">total <span class="num">33</span></div>
    </div>
  </section>
</div>
</body>
</html>
