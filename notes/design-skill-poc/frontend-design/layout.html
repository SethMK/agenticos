<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGENTICOS — /</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:           #0A0A0A;
    --bg-panel:     #111111;
    --bg-elevated:  #161616;
    --fg:           #E6E6E6;
    --fg-dim:       #9A9A9A;
    --muted:        #6B6B6B;
    --border:       #2A2A2A;
    --border-strong:#3A3A3A;
    --accent:       #FF6A00;
    --accent-dim:   #B24A00;
    --accent-ink:   #0A0A0A;
    --size-sm: 0.75rem;
    --size-md: 0.875rem;
    --size-lg: 1.125rem;
    --size-xl: 3rem;
    --space-1: 0.25rem;
    --space-2: 0.5rem;
    --space-3: 0.75rem;
    --space-4: 1rem;
    --space-5: 1.5rem;
    --space-6: 2rem;
    --space-7: 3rem;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --font-display: "Space Mono", "JetBrains Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font-mono);
    font-size: var(--size-md);
    line-height: 1.45;
    font-variant-numeric: tabular-nums lining-nums;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  /* Page scaffold with dotted outer rule (Vercel Ship lineage) */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: var(--space-6);
    position: relative;
  }

  /* Top scanline / status strip */
  .scanline {
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: var(--space-2) var(--space-3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: var(--muted);
    font-size: var(--size-sm);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: var(--space-6);
  }

  .scanline-left { display: flex; gap: var(--space-4); }
  .scanline .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    margin-right: var(--space-2);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% {opacity:1} 50% {opacity:0.35} }

  /* Wordmark header */
  header.brand {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: var(--space-4);
    border-bottom: 1px dotted var(--border-strong);
    margin-bottom: var(--space-6);
  }
  .wordmark {
    font-family: var(--font-display);
    font-size: 2.25rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.04em;
    line-height: 1;
  }
  .wordmark .slash { color: var(--muted); margin: 0 0.4ch; }
  .wordmark .path  { color: var(--fg-dim); font-weight: 400; }
  .brand-meta {
    color: var(--muted);
    font-size: var(--size-sm);
    text-align: right;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .brand-meta b { color: var(--fg); font-weight: 500; }

  /* Two-column primary grid */
  .grid {
    display: grid;
    grid-template-columns: minmax(280px, 360px) 1fr;
    gap: var(--space-6);
    margin-bottom: var(--space-6);
  }

  /* Panels share corner-bracket framing */
  .panel {
    position: relative;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: var(--space-5);
  }
  .panel::before,
  .panel::after,
  .panel > .bracket-bl,
  .panel > .bracket-br {
    content: "";
    position: absolute;
    width: 12px;
    height: 12px;
    border: 1px solid var(--accent);
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
  .panel::after  { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
  .panel > .bracket-bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
  .panel > .bracket-br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

  /* StatCard */
  .stat-card .label {
    font-size: var(--size-sm);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .stat-card .label::before {
    content: "◆";
    color: var(--accent);
    font-size: 0.6em;
  }
  .stat-card .value {
    font-family: var(--font-display);
    font-size: var(--size-xl);
    color: var(--accent);
    line-height: 1.05;
    margin: var(--space-4) 0 var(--space-3);
    letter-spacing: -0.02em;
  }
  .stat-card .delta {
    font-size: var(--size-sm);
    color: var(--fg);
    display: flex;
    align-items: baseline;
    gap: var(--space-2);
  }
  .stat-card .delta .arrow {
    color: var(--accent);
    font-size: 0.85em;
  }
  .stat-card .delta .pct { color: var(--accent); font-weight: 600; }
  .stat-card .delta .vs  { color: var(--muted); }

  /* Mini hairline divider inside the stat card */
  .hr-dot {
    border: none;
    border-top: 1px dotted var(--border-strong);
    margin: var(--space-4) 0;
  }
  .stat-card .sub-row {
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: var(--size-sm);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .stat-card .sub-row span:last-child { color: var(--fg); }

  /* Chart panel */
  .chart-panel { display: flex; flex-direction: column; }
  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: var(--space-4);
    padding-bottom: var(--space-3);
    border-bottom: 1px dotted var(--border-strong);
  }
  .chart-title {
    font-size: var(--size-sm);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }
  .chart-title b { color: var(--fg); font-weight: 500; }
  .chart-legend {
    font-size: var(--size-sm);
    color: var(--muted);
    display: flex;
    gap: var(--space-4);
  }
  .chart-legend .swatch {
    display: inline-block;
    width: 10px; height: 2px;
    background: var(--accent);
    vertical-align: middle;
    margin-right: var(--space-2);
  }

  .chart-svg-wrap {
    flex: 1;
    width: 100%;
    height: 240px;
  }
  .chart-svg-wrap svg { width: 100%; height: 100%; display: block; }

  .chart-footer {
    display: flex;
    justify-content: space-between;
    margin-top: var(--space-3);
    color: var(--muted);
    font-size: var(--size-sm);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Log feed */
  .log-feed {
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: var(--space-3) var(--space-4);
  }
  .log-feed-header {
    color: var(--muted);
    font-size: var(--size-sm);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: var(--space-3);
    padding-bottom: var(--space-2);
    border-bottom: 1px dotted var(--border);
  }
  .log-row {
    display: grid;
    grid-template-columns: 60px 80px 1fr auto;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-2) 0;
    font-size: var(--size-md);
  }
  .log-row .ts    { color: var(--muted); }
  .log-row .sid   { color: var(--accent); font-weight: 500; }
  .log-row .msg   { color: var(--fg); }
  .log-row .glyph { color: var(--accent); font-size: 0.8em; }

  /* Bottom rule */
  footer.footer {
    margin-top: var(--space-6);
    padding-top: var(--space-4);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    color: var(--muted);
    font-size: var(--size-sm);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .grid { grid-template-columns: 1fr; }
    .wordmark { font-size: 1.75rem; }
  }

  ::selection { background: var(--accent); color: var(--accent-ink); }
</style>
</head>
<body>
  <div class="page">

    <div class="scanline">
      <div class="scanline-left">
        <span><span class="dot"></span>ONLINE</span>
        <span>SESSION 0x1A4F</span>
        <span>2026-05-11 00:30 UTC</span>
      </div>
      <div>v0.2.0 // STABLE</div>
    </div>

    <header class="brand">
      <div class="wordmark">
        AGENTICOS<span class="slash">/</span><span class="path">root</span>
      </div>
      <div class="brand-meta">
        operator <b>marcin.kokott</b><br/>
        uptime <b>14d 03h 22m</b>
      </div>
    </header>

    <section class="grid">
      <!-- StatCard -->
      <article class="panel stat-card" aria-label="Tokens stat">
        <span class="bracket-bl"></span><span class="bracket-br"></span>
        <div class="label">TOKENS</div>
        <div class="value">2.4M</div>
        <div class="delta">
          <span class="arrow">▲</span>
          <span class="pct">+18%</span>
          <span class="vs">vs last week</span>
        </div>
        <hr class="hr-dot" />
        <div class="sub-row">
          <span>BUDGET</span><span>4.0M</span>
        </div>
        <div class="sub-row" style="margin-top:var(--space-2)">
          <span>BURN</span><span>60%</span>
        </div>
      </article>

      <!-- Chart -->
      <article class="panel chart-panel" aria-label="30-day usage trend">
        <span class="bracket-bl"></span><span class="bracket-br"></span>
        <div class="chart-header">
          <div class="chart-title">USAGE <b>// 30D</b></div>
          <div class="chart-legend">
            <span><span class="swatch"></span>TOKENS / DAY</span>
          </div>
        </div>
        <div class="chart-svg-wrap">
          <svg viewBox="0 0 600 240" preserveAspectRatio="none" aria-hidden="true">
            <defs>
              <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%"  stop-color="#FF6A00" stop-opacity="0.40"/>
                <stop offset="60%" stop-color="#FF6A00" stop-opacity="0.10"/>
                <stop offset="100%" stop-color="#FF6A00" stop-opacity="0.00"/>
              </linearGradient>
              <pattern id="grid" width="60" height="40" patternUnits="userSpaceOnUse">
                <path d="M 60 0 L 0 0 0 40" fill="none" stroke="#2A2A2A" stroke-width="0.5" stroke-dasharray="2,3"/>
              </pattern>
            </defs>
            <rect x="0" y="0" width="600" height="240" fill="url(#grid)"/>
            <!-- Y axis ticks -->
            <g font-family="JetBrains Mono" font-size="9" fill="#6B6B6B">
              <text x="4" y="20">3.0M</text>
              <text x="4" y="80">2.0M</text>
              <text x="4" y="140">1.0M</text>
              <text x="4" y="200">0</text>
            </g>
            <!-- Area path - 30 fake datapoints, gentle uptrend with volatility -->
            <path d="
              M 0 180
              L 20 175 L 40 178 L 60 165 L 80 170
              L 100 158 L 120 162 L 140 145 L 160 155
              L 180 138 L 200 142 L 220 130 L 240 122
              L 260 135 L 280 118 L 300 110 L 320 115
              L 340 95  L 360 100 L 380 88  L 400 82
              L 420 90  L 440 70  L 460 78  L 480 60
              L 500 65  L 520 48  L 540 55  L 560 40
              L 580 32  L 600 28
              L 600 240 L 0 240 Z"
              fill="url(#areaFill)" stroke="none"/>
            <!-- Line path -->
            <path d="
              M 0 180
              L 20 175 L 40 178 L 60 165 L 80 170
              L 100 158 L 120 162 L 140 145 L 160 155
              L 180 138 L 200 142 L 220 130 L 240 122
              L 260 135 L 280 118 L 300 110 L 320 115
              L 340 95  L 360 100 L 380 88  L 400 82
              L 420 90  L 440 70  L 460 78  L 480 60
              L 500 65  L 520 48  L 540 55  L 560 40
              L 580 32  L 600 28"
              fill="none" stroke="#FF6A00" stroke-width="1.5" stroke-linejoin="round"/>
            <!-- Last point marker -->
            <circle cx="600" cy="28" r="3" fill="#FF6A00"/>
            <circle cx="600" cy="28" r="6" fill="none" stroke="#FF6A00" stroke-width="0.5" opacity="0.5"/>
          </svg>
        </div>
        <div class="chart-footer">
          <span>D-30</span>
          <span>D-20</span>
          <span>D-10</span>
          <span>TODAY</span>
        </div>
      </article>
    </section>

    <section class="log-feed" aria-label="Log feed">
      <div class="log-feed-header">LOG // TAIL -F</div>
      <div class="log-row">
        <span class="ts">00:30</span>
        <span class="sid">S001</span>
        <span class="msg">done</span>
        <span class="glyph">●</span>
      </div>
    </section>

    <footer class="footer">
      <span>AGENTICOS // PUBLIC CV</span>
      <span>RENDERED 47ms</span>
    </footer>

  </div>
</body>
</html>
