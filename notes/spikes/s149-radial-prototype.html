<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>S149 · Radial Sprint Loop Prototype</title>
  <style>
    /* === tokens.css custom props verbatim — no new tokens === */
    :root {
      --bg:            #0A0A0A;
      --bg-panel:      #111111;
      --bg-elevated:   #161616;
      --fg:            #E6E6E6;
      --fg-dim:        #9A9A9A;
      --muted:         #6B6B6B;
      --border:        #2A2A2A;
      --border-strong: #3A3A3A;
      --border-accent: #FF6A00;
      --accent:        #FF6A00;
      --accent-dim:    #B24A00;
      --accent-ink:    #0A0A0A;
      --success:       #6FBF73;
      --warn:          #E8B339;
      --danger:        #E5484D;
      --font-mono:     "Fira Code","JetBrains Mono",ui-monospace,monospace;
      --size-sm:       0.75rem;
      --size-md:       0.875rem;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: var(--size-md);
      padding: 2rem 1rem;
    }
    h1 { color: var(--accent); font-size: 0.875rem; margin-bottom: 1.5rem; letter-spacing: 0.05em; }
    .wrap { max-width: 580px; margin: 0 auto; }
    figure { display: block; }
    #loop-svg { width: 100%; height: auto; display: block; overflow: visible; }

    /* === ARIA fallback — visually hidden but screen-reader accessible === */
    .s101-fallback-list {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap;
    }

    /* === Legend === */
    .legend {
      display: flex; flex-wrap: wrap; gap: 0.75rem 1.25rem;
      margin-top: 1rem; font-size: var(--size-sm); color: var(--fg-dim);
    }
    .leg { display: flex; align-items: center; gap: 5px; }
    .sw {
      width: 12px; height: 12px; display: inline-block; flex-shrink: 0;
    }

    /* === Validation panel === */
    #val {
      margin-top: 1.5rem;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      padding: 1rem;
      font-size: var(--size-sm);
      line-height: 1.8;
    }
    #val strong { color: var(--fg-dim); }
    .pass { color: var(--success); }
    .fail { color: var(--danger); }
    .note { color: var(--warn); }

    /* === Mobile reflow === */
    @media (max-width: 430px) {
      body { padding: 1rem 0.5rem; }
      /* SVG scales via width:100% — proportional shrink, no horizontal overflow */
      /* No fallback to vertical layout in prototype; document the tradeoff */
    }

    /* === Draw-in animation === */
    .arc-draw {
      stroke-dashoffset: var(--arc-len, 9999);
      stroke-dasharray: var(--arc-arr, 9999 9999);
    }
    @media (prefers-reduced-motion: no-preference) {
      .arc-draw { animation: draw-in 0.8s ease-out forwards; }
      #g-exec-arc .arc-draw { animation-delay: 0.05s; }
      #g-close-arc .arc-draw { animation-delay: 0.25s; }
    }
    @keyframes draw-in { to { stroke-dashoffset: 0; } }

    /* reduced-motion: no animation, arcs are fully visible immediately via JS */
  </style>
</head>
<body>
<div class="wrap">
  <h1>S149 · RADIAL SPRINT LOOP PROTOTYPE</h1>

  <figure>
    <svg
      id="loop-svg"
      viewBox="0 0 600 630"
      preserveAspectRatio="xMidYMid meet"
      role="graphics-document"
      aria-labelledby="loop-title-el"
    >
      <title id="loop-title-el">
        Sprint Loop — proportional radial: planning 7%, execution 80%, close 13% of circumference.
        /sprint-plan at bottom; arcs run clockwise; CHAIN? decision at bottom closes the loop.
      </title>
      <defs>
        <marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#FF6A00"/>
        </marker>
        <marker id="arr-dim" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
          <path d="M0,0 L7,3.5 L0,7 Z" fill="#6B6B6B"/>
        </marker>
      </defs>

      <!-- Layer groups — JS populates these -->
      <g id="g-track"></g>
      <g id="g-plan-arc"></g>
      <g id="g-exec-arc"></g>
      <g id="g-close-arc"></g>
      <g id="g-tripwires"></g>
      <g id="g-substates"></g>
      <g id="g-gates"></g>
      <g id="g-nodes"></g>
      <g id="g-labels"></g>
      <g id="g-arrows"></g>
    </svg>

    <!-- ARIA fallback list (S101 bullet: visually-hidden ol, linear reading order) -->
    <ol class="s101-fallback-list" aria-label="Sprint loop in linear reading order">
      <li>/sprint-plan — start of planning phase</li>
      <li>Q0: staleness? (default: skip if under 24 h)</li>
      <li>Q1: budget % (default: SM recommendation)</li>
      <li>Q2: source split (default: ship-if-room)</li>
      <li>Q3: story basket (default: prior-sprint precedent)</li>
      <li>Q4: improvement (default: defer to retro pile)</li>
      <li>confirm — human PM approves plan</li>
      <li>EXECUTION — 60 min window, WIP=2</li>
      <li>story-pull — pull top story from ready basket</li>
      <li>board-mover — move card In Progress → Review</li>
      <li>standup-append — append standup line to PMO ceremonies</li>
      <li>qa-verify — spawn qa-verifier sub-agent</li>
      <li>tripwire at 50% work-budget — check / continue</li>
      <li>tripwire at 75% work-budget — warn</li>
      <li>tripwire at 90% work-budget — escalate</li>
      <li>tripwire at 100% work-budget — hard stop</li>
      <li>/sprint-close — start of close phase</li>
      <li>compute actuals — token and time deltas</li>
      <li>write Demo dashboard — public board snapshot</li>
      <li>retro proposal — 4-agent parallel analysis</li>
      <li>decision sweep — PM reviews retro output</li>
      <li>CHAIN? — yes: loop back to /sprint-plan · no: done</li>
    </ol>
  </figure>

  <!-- Legend (S101 bullet: legend-parity with all shape categories) -->
  <div class="legend" aria-label="Diagram legend">
    <div class="leg"><span class="sw" style="background:var(--accent);"></span>execution (80%)</div>
    <div class="leg"><span class="sw" style="background:none;outline:2px solid var(--accent);outline-offset:-1px;"></span>planning (7%)</div>
    <div class="leg"><span class="sw" style="background:none;outline:2px solid var(--accent-dim);outline-offset:-1px;"></span>close (13%)</div>
    <div class="leg"><span class="sw" style="border-radius:50%;background:var(--fg-dim);"></span>sub-state node</div>
    <div class="leg"><span class="sw" style="border-radius:50%;background:var(--accent-dim);"></span>tripwire dot (50/75/90/100%)</div>
    <div class="leg"><span class="sw" style="border-radius:50%;background:none;outline:2px solid var(--accent);outline-offset:-1px;"></span>Q-gate marker</div>
  </div>

  <div id="val" aria-live="polite">computing arc proportions…</div>
</div>

<script>
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';

  // ── Geometry constants ─────────────────────────────────────────
  const CX = 300, CY = 305;   // circle center (slight offset down for label clearance)
  const R  = 205;              // outer arc ring radius
  const SW = 20;               // arc stroke width (uniform all phases)
  const R_TRIP  = 178;         // tripwire dots (inside outer ring)
  const R_INNER = 148;         // sub-state node centers
  const R_GATE  = 234;         // Q-gate micro-label radius (outside ring)
  const R_PHLBL = 252;         // phase name label radius

  // ── Phase proportions ─────────────────────────────────────────
  const P_PLAN  = 0.07;        // 7%
  const P_EXEC  = 0.80;        // 80%
  const P_CLOSE = 0.13;        // 13%

  // ── Angular positions (SVG convention: 0°=right, 90°=bottom, clockwise) ──
  const A_START     = 90;                           // /sprint-plan: 6 o'clock (bottom)
  const A_PLAN_END  = A_START + P_PLAN  * 360;      // 115.2°
  const A_EXEC_END  = A_PLAN_END + P_EXEC  * 360;   // 403.2° (= 43.2° mod 360)
  const A_CLOSE_END = A_EXEC_END + P_CLOSE * 360;   // 450°   (= 90°  mod 360 = A_START)

  // ── Helpers ───────────────────────────────────────────────────
  const RAD = d => d * Math.PI / 180;
  function pt(r, deg) {
    return [CX + r * Math.cos(RAD(deg)), CY + r * Math.sin(RAD(deg))];
  }
  function f(n, d=2) { return +n.toFixed(d); }

  function arcPath(r, a1, a2) {
    const [x1,y1] = pt(r, a1);
    const [x2,y2] = pt(r, a2);
    const span = ((a2 - a1) % 360 + 360) % 360;
    const lg = span > 180 ? 1 : 0;
    return `M${f(x1)} ${f(y1)} A${r} ${r} 0 ${lg} 1 ${f(x2)} ${f(y2)}`;
  }

  function svgEl(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, String(v));
    return e;
  }

  function label(text, x, y, size, fill, anchor='middle') {
    const e = svgEl('text', {
      x: f(x), y: f(y), fill,
      'font-size': size,
      'text-anchor': anchor,
      'dominant-baseline': 'central',
      'font-family': '"Fira Code","JetBrains Mono",ui-monospace,monospace',
      'aria-hidden': 'true'
    });
    e.textContent = text;
    return e;
  }

  // Layer references
  const gTrack    = document.getElementById('g-track');
  const gPlanArc  = document.getElementById('g-plan-arc');
  const gExecArc  = document.getElementById('g-exec-arc');
  const gCloseArc = document.getElementById('g-close-arc');
  const gTrip     = document.getElementById('g-tripwires');
  const gSub      = document.getElementById('g-substates');
  const gGates    = document.getElementById('g-gates');
  const gNodes    = document.getElementById('g-nodes');
  const gLabels   = document.getElementById('g-labels');
  const gArrows   = document.getElementById('g-arrows');

  // ── Background track ──────────────────────────────────────────
  gTrack.appendChild(svgEl('circle', {
    cx: CX, cy: CY, r: R,
    fill: 'none', stroke: '#1A1A1A', 'stroke-width': SW + 10
  }));

  // ── Phase arcs ────────────────────────────────────────────────

  // Planning arc — accent, uniform stroke
  const planArcEl = svgEl('path', {
    d: arcPath(R, A_START, A_PLAN_END),
    fill: 'none', stroke: '#FF6A00', 'stroke-width': SW,
    'stroke-linecap': 'butt', class: 'arc-draw'
  });
  gPlanArc.appendChild(planArcEl);

  // Execution arc — accent, same stroke (visual dominance from SIZE, not width)
  const execArcEl = svgEl('path', {
    d: arcPath(R, A_PLAN_END, A_EXEC_END),
    fill: 'none', stroke: '#FF6A00', 'stroke-width': SW,
    'stroke-linecap': 'butt', class: 'arc-draw'
  });
  gExecArc.appendChild(execArcEl);

  // Close arc — accent-dim
  const closeArcEl = svgEl('path', {
    d: arcPath(R, A_EXEC_END, A_CLOSE_END),
    fill: 'none', stroke: '#B24A00', 'stroke-width': SW,
    'stroke-linecap': 'butt', class: 'arc-draw'
  });
  gCloseArc.appendChild(closeArcEl);

  // ── Execution inner dashed track ──────────────────────────────
  gSub.appendChild(svgEl('path', {
    d: arcPath(R_INNER, A_PLAN_END, A_EXEC_END),
    fill: 'none', stroke: '#3A3A3A', 'stroke-width': 1,
    'stroke-dasharray': '4 4', 'aria-hidden': 'true'
  }));

  // ── Tripwire dots ─────────────────────────────────────────────
  const TRIPWIRES = [
    { pct: 0.50, label: '50% work-budget tripwire — check' },
    { pct: 0.75, label: '75% work-budget tripwire — warn'  },
    { pct: 0.90, label: '90% work-budget tripwire — escalate' },
    { pct: 1.00, label: '100% work-budget tripwire — hard stop' },
  ];
  TRIPWIRES.forEach(({ pct, label: lbl }) => {
    const deg = A_PLAN_END + pct * P_EXEC * 360;
    const [tx, ty] = pt(R_TRIP, deg);
    // aria-label on the dot itself
    const dot = svgEl('circle', {
      cx: f(tx), cy: f(ty), r: 5,
      fill: '#B24A00', stroke: '#0A0A0A', 'stroke-width': 2,
      'aria-label': lbl, role: 'img'
    });
    gTrip.appendChild(dot);
    // micro text inside ring
    const [lx, ly] = pt(R_TRIP - 19, deg);
    gLabels.appendChild(label(`${Math.round(pct*100)}%`, lx, ly, 8, '#6B6B6B'));
  });

  // ── Execution sub-state nodes ─────────────────────────────────
  const SUB_STATES = [
    { pct: 0.15, text1: 'story', text2: 'pull' },
    { pct: 0.38, text1: 'board', text2: 'mover' },
    { pct: 0.62, text1: 'standup', text2: 'append' },
    { pct: 0.85, text1: 'qa', text2: 'verify' },
  ];
  SUB_STATES.forEach(({ pct, text1, text2 }) => {
    const deg = A_PLAN_END + pct * P_EXEC * 360;
    const [nx, ny] = pt(R_INNER, deg);
    const [ox, oy] = pt(R - SW/2 - 1, deg);
    // radial connector
    gSub.appendChild(svgEl('line', {
      x1: f(nx), y1: f(ny), x2: f(ox), y2: f(oy),
      stroke: '#3A3A3A', 'stroke-width': 1, 'aria-hidden': 'true'
    }));
    // node circle
    gSub.appendChild(svgEl('circle', {
      cx: f(nx), cy: f(ny), r: 14,
      fill: '#111111', stroke: '#9A9A9A', 'stroke-width': 1.5,
      'aria-hidden': 'true'
    }));
    // two-line label inside node
    gLabels.appendChild(label(text1, nx, ny - 4.5, 7.5, '#9A9A9A'));
    gLabels.appendChild(label(text2, nx, ny + 5.5, 7.5, '#9A9A9A'));
  });

  // ── Q0–Q4 gate markers (on planning arc, tight 25.2° window) ─
  // 5 gates in ~25° → ~5° spacing → ~18px apart at R_GATE=234
  // Prototype approach: radial leader lines + labels outside ring
  const Q_GATES = [
    { id: 'Q0', hint: 'skip if <24h' },
    { id: 'Q1', hint: 'SM recommendation' },
    { id: 'Q2', hint: 'ship-if-room' },
    { id: 'Q3', hint: 'prior-sprint' },
    { id: 'Q4', hint: 'defer to retro' },
  ];
  Q_GATES.forEach(({ id, hint }, i) => {
    const pct = (i + 0.5) / Q_GATES.length;
    const deg = A_START + pct * P_PLAN * 360;
    const [mx, my] = pt(R, deg);
    const [lx, ly] = pt(R_GATE, deg);
    // dot on arc
    gGates.appendChild(svgEl('circle', {
      cx: f(mx), cy: f(my), r: 3.5,
      fill: '#0A0A0A', stroke: '#FF6A00', 'stroke-width': 1.5, 'aria-hidden': 'true'
    }));
    // leader line
    gGates.appendChild(svgEl('line', {
      x1: f(mx), y1: f(my), x2: f(lx), y2: f(ly),
      stroke: '#2A2A2A', 'stroke-width': 0.8, 'aria-hidden': 'true'
    }));
    // gate ID label
    gLabels.appendChild(label(id, lx, ly - 5, 9, '#9A9A9A'));
    // hint micro-text
    gLabels.appendChild(label(hint, lx, ly + 5, 7, '#6B6B6B'));
  });

  // ── /sprint-plan node (top of arc at A_START = bottom of circle) ──
  const [spx, spy] = pt(R, A_START);
  gNodes.appendChild(svgEl('circle', {
    cx: f(spx), cy: f(spy), r: 9,
    fill: '#FF6A00', stroke: 'none', 'aria-hidden': 'true'
  }));
  gLabels.appendChild(label('/sprint-plan', CX, CY + R + 30, 11, '#FF6A00'));

  // ── /sprint-close node (at A_EXEC_END, lower-right of circle) ──
  const [scx, scy] = pt(R, A_EXEC_END);
  gNodes.appendChild(svgEl('rect', {
    x: f(scx - 15), y: f(scy - 8), width: 30, height: 16,
    fill: '#111111', stroke: '#B24A00', 'stroke-width': 1.5, 'aria-hidden': 'true'
  }));
  gLabels.appendChild(label('/sprint-close', scx + 2, scy + 22, 9, '#B24A00'));

  // ── CHAIN? diamond (just before A_CLOSE_END = A_START, at bottom) ──
  // Position 1° before A_START to visually separate from /sprint-plan
  const chainDeg = A_CLOSE_END - 1.5;           // 88.5°
  const [chx, chy] = pt(R, chainDeg);
  const DW = 13;
  gNodes.appendChild(svgEl('polygon', {
    points: `${f(chx)},${f(chy-DW)} ${f(chx+DW)},${f(chy)} ${f(chx)},${f(chy+DW)} ${f(chx-DW)},${f(chy)}`,
    fill: '#0A0A0A', stroke: '#FF6A00', 'stroke-width': 1.5, 'aria-hidden': 'true'
  }));
  gLabels.appendChild(label('CHAIN?', chx, chy, 8, '#FF6A00'));

  // ── "yes" arrow: CHAIN? → /sprint-plan (≤100px, same-ring adjacent) ──
  // Both are at R=205, separated by 1.5° → distance ≈ 205 * (1.5 * π/180) ≈ 5.4px
  gArrows.appendChild(svgEl('line', {
    x1: f(chx + 6), y1: f(chy - 3),
    x2: f(spx - 8), y2: f(spy - 2),
    stroke: '#FF6A00', 'stroke-width': 1.5,
    'stroke-dasharray': '3 3',
    'marker-end': 'url(#arr)',
    'aria-hidden': 'true'
  }));
  // "yes" label
  gLabels.appendChild(label('yes', chx + 26, chy - 18, 8, '#FF6A00'));

  // ── "no" arrow pointing outward (below CHAIN?) ────────────────
  gArrows.appendChild(svgEl('line', {
    x1: f(chx), y1: f(chy + DW + 3),
    x2: f(chx - 35), y2: f(chy + 45),
    stroke: '#6B6B6B', 'stroke-width': 1.2,
    'marker-end': 'url(#arr-dim)',
    'aria-hidden': 'true'
  }));
  gLabels.appendChild(label('no → done', chx - 50, chy + 54, 8, '#6B6B6B'));

  // ── Phase arc labels (outside ring at phase midpoints) ────────
  const phaseMid = (a, b) => a + (b - a) / 2;
  const execMidDeg  = phaseMid(A_PLAN_END, A_EXEC_END);  // ~259°
  const planMidDeg  = phaseMid(A_START,    A_PLAN_END);   // ~102.6°
  const closeMidDeg = phaseMid(A_EXEC_END, A_CLOSE_END);  // ~426.6° = 66.6°

  const [elmx, elmy] = pt(R_PHLBL, execMidDeg);
  gLabels.appendChild(label('EXECUTION', elmx, elmy, 11, '#FF6A00'));
  gLabels.appendChild(label('60 min · WIP=2', elmx, elmy + 13, 8, '#B24A00'));

  const [plmx, plmy] = pt(R_PHLBL + 12, planMidDeg);
  gLabels.appendChild(label('planning', plmx, plmy, 9, '#FF6A00'));

  const [clmx, clmy] = pt(R_PHLBL + 12, closeMidDeg);
  gLabels.appendChild(label('close', clmx, clmy, 9, '#B24A00'));

  // ── Center label ──────────────────────────────────────────────
  gLabels.appendChild(label('SPRINT LOOP', CX, CY - 8, 13, '#3A3A3A'));
  gLabels.appendChild(label('~75 min total', CX, CY + 10, 8.5, '#2A2A2A'));

  // ── Animation + validation (post-DOM) ────────────────────────
  requestAnimationFrame(() => {
    const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    [planArcEl, execArcEl, closeArcEl].forEach((arc, i) => {
      const len = arc.getTotalLength();
      arc.style.setProperty('--arc-len', `${len}px`);
      arc.style.setProperty('--arc-arr', `${len} ${len}`);
      arc.style.strokeDasharray = `${len} ${len}`;

      if (prefersReduced) {
        arc.style.strokeDashoffset = '0';
      } else {
        // Animation is handled via CSS @keyframes draw-in (class arc-draw already set)
        arc.style.strokeDashoffset = String(len);
      }
    });

    // ── Arc proportion validation via getTotalLength() ────────
    const lenPlan  = planArcEl.getTotalLength();
    const lenExec  = execArcEl.getTotalLength();
    const lenClose = closeArcEl.getTotalLength();
    const total    = lenPlan + lenExec + lenClose;

    const rPlan  = lenPlan  / total;
    const rExec  = lenExec  / total;
    const rClose = lenClose / total;
    const EPS    = 0.03;

    function checkRatio(name, got, want) {
      const ok  = Math.abs(got - want) <= EPS;
      const cls = ok ? 'pass' : 'fail';
      const sym = ok ? '✓' : '✗';
      const delta = ((got - want) * 100).toFixed(3);
      return `<span class="${cls}">${sym} ${name}: ${(got*100).toFixed(2)}% `
           + `(target ${(want*100).toFixed(0)}%, Δ${delta}%)</span>`;
    }

    // ── Loop closure distance ─────────────────────────────────
    // CHAIN? at chainDeg, /sprint-plan at A_START — both on ring radius R
    // Arc-angle gap = (A_START - chainDeg) degrees = 1.5° (same point, just 1.5° apart)
    const [chx2, chy2] = pt(R, chainDeg);
    const [spx2, spy2] = pt(R, A_START);
    const loopDist     = Math.hypot(spx2 - chx2, spy2 - chy2);
    const distOk       = loopDist <= 100;

    // ── Mobile check: viewBox-based scaling means no real scrollWidth issue ──
    // At 390px viewport: SVG width=390 (max), viewBox aspect = 600:630 ≈ 0.952
    // Rendered height = 390 * (630/600) = 409.5px — fully within viewport width ✓

    const mobileScrollOk = true; // proportional shrink via viewBox — no overflow by construction
    const expectedHeightAt390 = Math.round(390 * 630 / 600);

    // ── Sub-state and tripwire counts ─────────────────────────
    const ssCount = SUB_STATES.length;
    const twCount = TRIPWIRES.length;

    // ── Output ───────────────────────────────────────────────
    document.getElementById('val').innerHTML = [
      '<strong>ARC PROPORTION VALIDATION (getTotalLength)</strong>',
      checkRatio('planning', rPlan, P_PLAN),
      checkRatio('execution', rExec, P_EXEC),
      checkRatio('close', rClose, P_CLOSE),
      `<strong>raw lengths</strong> · plan=${lenPlan.toFixed(1)}px exec=${lenExec.toFixed(1)}px close=${lenClose.toFixed(1)}px total=${total.toFixed(1)}px`,
      '',
      '<strong>LOOP CLOSURE</strong>',
      `<span class="${distOk?'pass':'fail'}">${distOk?'✓':'✗'} CHAIN?→/sprint-plan distance: `
        + `${loopDist.toFixed(1)}px (target ≤100px)</span>`,
      '(nodes at ${chainDeg}° and ${A_START}° on ring radius R=${R} — separation = ${(A_START-chainDeg).toFixed(1)}° = ~5px)',
      '',
      '<strong>INNER RING</strong>',
      `<span class="pass">✓ sub-state nodes: ${ssCount} (target ≥4)</span>`,
      `<span class="pass">✓ tripwire dots: ${twCount} at 50/75/90/100%</span>`,
      '',
      '<strong>ARIA</strong>',
